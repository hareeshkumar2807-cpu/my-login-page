<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Screen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>
    </div>

    <!-- 1. Load Firebase Library Engines First -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <!-- 2. Run Backend Connection Directly -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAnQIA5uxp0jzv8b0hUEow9yBzpBF-ofUI",
            authDomain: "://firebaseapp.com",
            projectId: "my-login-system-e636d",
            storageBucket: "my-login-system-e636d.firebasestorage.app",
            messagingSenderId: "627391470053",
            appId: "1:627391470053:web:a2600bde4b1b93e8dc770c",
            measurementId: "G-WWE3D6SX1K"
        };

        // Initialize Firebase Backend
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Intercept Form Submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Automatically create user profile
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("Account successfully created and saved to database!");
                    console.log("Registered user:", userCredential.user);
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        });
    </script>
</body>
</html>
